<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}PetLife{% endblock %}</title>

    <link rel="icon"
          href="{{ request.url_for('static', path='img/logo_petLife_aba.png') }}"
          type="image/png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ request.url_for('static', path='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ request.url_for('static', path='css/dicas.css') }}">

    <link rel="stylesheet"
          href="{{ request.url_for('static', path='css/profile.css') }}">

    <link rel="stylesheet"
          href="{{ request.url_for('static', path='css/pet_register.css') }}">

    <link rel="stylesheet"
          href="{{ request.url_for('static', path='css/pet_diary.css') }}">

    <link rel="stylesheet"
          href="{{ request.url_for('static', path='css/admin/dashboard.css') }}">

</head>

<body>

    {% block content %}{% endblock %}

    <!-- Bootstrap -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}

</body>

</html>
